name: Build and deploy

on:
  push:
    branches: [main]
    # Docs/tests never touch the deployed jar, but every push here costs a
    # full rebuild + a live restart -- not worth paying for a README or
    # MUnit-suite edit alone (see the sibling ace-currency-api repo's
    # deploy.yml for the same change, motivated by a real 46min ACE
    # redeploy this project hit from a docs-only push).
    paths-ignore:
      - "**.md"
  # Every PR (including Dependabot's dependency/image bumps) gets the build
  # check; only main deploys (see the `if` on the deploy job).
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Exact runner label instead of ubuntu-latest. GitHub still refreshes the
    # tools inside this image weekly, which is why the build itself does not
    # use the runner's Maven/JDK at all (next step).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # MUnit is not run here: the public "CE" test runtime that MUnit
      # downloads from Maven doesn't ship the DataWeave/ee-core module this
      # flow depends on (only the licensed EE distribution does, which needs
      # Nexus EE credentials tied to a paid Mule support entitlement). The
      # MUnit suite still lives in src/test/munit and runs fine locally
      # against the real runtime on the VM -- see README.md.
      # The build runs in the Dockerfile's own build stage, pinned by digest,
      # not with whatever Maven the runner ships: a runner image update
      # (Aug -> Nov 2026) broke mule-maven-plugin 4.10.1 with a
      # NoSuchMethodError in the Maven resolver while the real build on the VM
      # was fine. One image declaration (the Dockerfile) = CI tests what gets
      # deployed, and Dependabot has a single place to bump.
      - name: Build the app in the Dockerfile's pinned build stage
        run: docker build --target build --progress=plain -t mule-weather-api-build .

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MULE_VM_SSH_KEY }}

      - name: Sync source to VM
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.MULE_VM_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude 'runtime' --exclude 'target' --exclude '.git' \
            ./ "${{ secrets.MULE_VM_USER }}@${{ secrets.MULE_VM_HOST }}:~/mule-weather-api/"

      - name: Build and restart container on VM
        run: |
          ssh "${{ secrets.MULE_VM_USER }}@${{ secrets.MULE_VM_HOST }}" '
            set -e
            cp ~/mule-runtime/mule-standalone.zip ~/mule-weather-api/runtime/mule-standalone.zip
            cd ~/mule-weather-api
            docker build -t mule-weather-api .
            docker stop mule-weather-api-app 2>/dev/null || true
            docker rm mule-weather-api-app 2>/dev/null || true
            docker run -d --name mule-weather-api-app \
              -p 127.0.0.1:8081:8081 \
              --restart unless-stopped \
              --memory=2g \
              -e INGEST_URL="${{ secrets.INGEST_URL }}" \
              -e INGEST_TOKEN="${{ secrets.INGEST_TOKEN }}" \
              mule-weather-api
          '
