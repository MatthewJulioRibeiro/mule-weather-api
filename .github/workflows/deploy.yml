name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # MUnit is not run here: the public "CE" test runtime that MUnit
      # downloads from Maven doesn't ship the DataWeave/ee-core module this
      # flow depends on (only the licensed EE distribution does, which needs
      # Nexus EE credentials tied to a paid Mule support entitlement). The
      # MUnit suite still lives in src/test/munit and runs fine locally
      # against the real runtime on the VM -- see README.md.
      - name: Build and package (compile check)
        run: mvn -B package -DskipTests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MULE_VM_SSH_KEY }}

      - name: Sync source to VM
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.MULE_VM_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude 'runtime' --exclude 'target' --exclude '.git' \
            ./ "${{ secrets.MULE_VM_USER }}@${{ secrets.MULE_VM_HOST }}:~/mule-weather-api/"

      - name: Build and restart container on VM
        run: |
          ssh "${{ secrets.MULE_VM_USER }}@${{ secrets.MULE_VM_HOST }}" '
            set -e
            cp ~/mule-runtime/mule-standalone.zip ~/mule-weather-api/runtime/mule-standalone.zip
            cd ~/mule-weather-api
            docker build -t mule-weather-api .
            docker stop mule-weather-api-app 2>/dev/null || true
            docker rm mule-weather-api-app 2>/dev/null || true
            docker run -d --name mule-weather-api-app \
              -p 127.0.0.1:8081:8081 \
              --restart unless-stopped \
              --memory=2g \
              -e INGEST_URL="${{ secrets.INGEST_URL }}" \
              -e INGEST_TOKEN="${{ secrets.INGEST_TOKEN }}" \
              mule-weather-api
          '
