openapi: 3.0.3
info:
  title: Weather API (Mule 4 demo)
  description: >
    Portfolio demo built with Mule 4: HTTP Listeners orchestrate public,
    keyless Open-Meteo endpoints (geocoding, then forecast + air quality in
    parallel) and reshape the result with DataWeave 2.0. Geocoding results
    are cached (Object Store, 1h TTL) and upstream calls retry transient
    failures automatically. Source: see the repository this documentation
    ships with.
  version: "1.0.0"
  license:
    name: Personal portfolio demo (non-commercial)
servers:
  - url: https://mule-demo.matheusribeiro.dev.br
paths:
  /api/weather:
    get:
      summary: Get current weather for a city
      description: >
        Resolves the given city name to coordinates (Open-Meteo geocoding),
        then fetches current conditions for those coordinates (Open-Meteo
        forecast) and returns a reshaped, bilingual (pt/en) response.
      parameters:
        - name: city
          in: query
          required: true
          description: City name to look up, e.g. "Indaiatuba" or "Sao Paulo".
          schema:
            type: string
          example: Indaiatuba
      responses:
        "200":
          description: Weather found for the given city.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
              example:
                city: Indaiatuba
                country: Brazil
                coordinates:
                  latitude: -23.09
                  longitude: -47.21
                temperatureCelsius: 24.3
                windSpeedKmh: 8.6
                description:
                  pt: Céu limpo
                  en: Clear sky
                observedAt: "2026-08-11T14:00"
                airQuality:
                  pm10: 6.7
                  pm2_5: 5.8
                  europeanAqi: 28
        "400":
          description: Missing the required `city` query param.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: MISSING_CITY
                message: "Informe o parâmetro 'city', ex: ?city=Sao Paulo"
        "404":
          description: City not found by the geocoding lookup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: CITY_NOT_FOUND
                message: "Cidade nao encontrada: 'Atlantis'"
        "502":
          description: Upstream Open-Meteo API unreachable or timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: UPSTREAM_UNAVAILABLE
                message: Servico de clima temporariamente indisponivel
        "500":
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: INTERNAL_ERROR
                message: Erro inesperado ao processar a requisicao
  /api/weather/compare:
    get:
      summary: Compare current weather across several cities at once
      description: >
        Resolves every city in parallel (Mule Parallel For Each) using the
        same resolver as the single-city endpoint above. A failure for one
        city (not found, upstream error) never fails the others -- each
        result reports its own ok/error status.
      parameters:
        - name: cities
          in: query
          required: true
          description: Comma-separated city names.
          schema:
            type: string
          example: "Indaiatuba,Sao Paulo,Curitiba"
      responses:
        "200":
          description: >
            Always 200 once at least one city was provided -- per-city
            failures are reported inside `results`, not as an HTTP error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CityResult"
              example:
                results:
                  - city: Indaiatuba
                    ok: true
                    error: null
                    data:
                      city: Indaiatuba
                      country: Brazil
                      coordinates: { latitude: -23.09, longitude: -47.21 }
                      temperatureCelsius: 24.3
                      windSpeedKmh: 8.6
                      description: { pt: Céu limpo, en: Clear sky }
                      observedAt: "2026-08-11T14:00"
                      airQuality: { pm10: 6.7, pm2_5: 5.8, europeanAqi: 28 }
                  - city: Atlantis
                    ok: false
                    error: CITY_NOT_FOUND
                    data: null
        "400":
          description: Missing the required `cities` query param.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: MISSING_CITIES
                message: "Informe o parametro 'cities' separado por virgula, ex: ?cities=Sao Paulo,Rio de Janeiro"
  /api/geocode:
    get:
      summary: Search for a place (country, state, city or neighborhood)
      description: >
        Server-side proxy to Photon, Komoot's free OpenStreetMap-based
        autocomplete geocoder, reshaped down to city/state/country/
        neighborhood. Powers the location search box on the portfolio
        site's demo widget. Photon was picked over OpenStreetMap's own
        Nominatim /search specifically because Nominatim doesn't handle
        partial words typed mid-search well. Runs server-side because
        Photon's public instance sends no CORS headers, so a browser
        can't call it directly. The `city` field of each result is
        what actually gets sent to /api/weather; the other fields are
        just for disambiguating the suggestion in the UI.
      parameters:
        - name: q
          in: query
          required: true
          description: Free-text search query, at least 3 characters.
          schema:
            type: string
          example: "Vila Madalena"
      responses:
        "200":
          description: Up to 6 matching places, best guess first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeocodeResult"
              example:
                results:
                  - label: "Vila Madalena, Pinheiros, São Paulo, Região Sudeste, 05434-000, Brasil"
                    city: São Paulo
                    state: São Paulo
                    country: Brasil
                    neighborhood: Vila Madalena
        "400":
          description: The `q` query param is missing or shorter than 3 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: QUERY_TOO_SHORT
                message: "Informe pelo menos 3 caracteres"
        "502":
          description: Photon is unreachable or timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: UPSTREAM_UNAVAILABLE
                message: "Servico de busca de localizacao temporariamente indisponivel"
components:
  schemas:
    WeatherResponse:
      type: object
      required:
        - city
        - coordinates
        - temperatureCelsius
        - windSpeedKmh
        - description
        - observedAt
      properties:
        city:
          type: string
        country:
          type: string
        coordinates:
          type: object
          properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        temperatureCelsius:
          type: number
          format: double
        windSpeedKmh:
          type: number
          format: double
        description:
          type: object
          description: Human-readable weather condition, pt-BR and English.
          properties:
            pt:
              type: string
            en:
              type: string
        observedAt:
          type: string
          description: Local timestamp (no timezone offset) as reported by Open-Meteo.
        airQuality:
          type: object
          nullable: true
          description: >
            Fetched in parallel with the forecast (Scatter-Gather). Null
            when the air-quality API failed or timed out -- this
            enrichment degrades gracefully rather than failing the whole
            request.
          properties:
            pm10:
              type: number
            pm2_5:
              type: number
            europeanAqi:
              type: integer
    CityResult:
      type: object
      required:
        - city
        - ok
        - error
        - data
      properties:
        city:
          type: string
        ok:
          type: boolean
        error:
          type: string
          nullable: true
          enum:
            - MISSING_CITY
            - CITY_NOT_FOUND
            - UPSTREAM_UNAVAILABLE
            - INTERNAL_ERROR
        data:
          $ref: "#/components/schemas/WeatherResponse"
          nullable: true
    GeocodeResult:
      type: object
      required:
        - label
        - city
      properties:
        label:
          type: string
          description: Full human-readable place name, built from Photon's result.
        city:
          type: string
          description: What actually gets sent to /api/weather.
        state:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        neighborhood:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - MISSING_CITY
            - MISSING_CITIES
            - CITY_NOT_FOUND
            - UPSTREAM_UNAVAILABLE
            - INTERNAL_ERROR
            - QUERY_TOO_SHORT
        message:
          type: string
